[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chairside-compare"
version = "0.6.0"
description = "Chairside preparation comparison with registered full-arch scans"
requires-python = ">=3.12,<3.13"
dependencies = ["general-model-registration==3.0.0", "numpy>=2", "scipy==1.18.1", "open3d==0.19.0", "PySide6>=6.8,<7", "vtk>=9.4,<10"]

[project.gui-scripts]
chairside-compare = "chairside_compare.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
